# Fleet compose 스택 (Phase A #195 + Phase B #197 · Part of #193) — 두 개의 문.
#   ttyd        : 문① 웹터미널 — 마운트 = workspace + cli-auth 만 (fleet-data·Docker 소켓 미마운트).
#   fleet       : 문② 오케스트레이션 서버(#197-B6) — 코어 엔진 + renderer 정적 서빙 + WS. fleet-data 는
#                 여기만 마운트. ports 없음 · 비특권 node · 시크릿은 env 주입만.
#   cloudflared : 터널 사이드카 (tunnel 프로파일). 토큰 기반·무상태. 대시보드 ingress 로 두 문을 각각
#                 Public Hostname 에 매핑(http://ttyd:7681 · http://fleet:8791).
#
# 사용:
#   실배포(터널 포함):  docker compose --env-file .env --profile tunnel up -d --build
#   로컬 검증(터널 X):  bash deploy/smoke.sh   ← 이미지·컨테이너 불변식만 검증(포트 퍼블리시는 스모크 한정)

# name 은 Phase A 볼륨 식별(cli-auth·workspace 로그인 자격) 보존을 위해 유지한다(변경 시 볼륨 고아화).
name: fleet-webterminal

services:
  ttyd:
    build:
      context: ./webterminal
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        CLAUDE_VERSION: ${CLAUDE_VERSION:-2.1.199}
        CODEX_VERSION: ${CODEX_VERSION:-0.142.5}
        GEMINI_VERSION: ${GEMINI_VERSION:-0.49.0}
        TTYD_VERSION: ${TTYD_VERSION:-1.7.7}
    image: fleet-webterminal:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true # tini = PID1 → 좀비 수거·시그널 전달
    environment:
      # 구독 로그인 모드: provider API 키를 넣지 않는다 — 있으면 OAuth 를 덮어써 인증이 깨진다(v3 §9).
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:-}
      TTYD_MAX_CLIENTS: ${TTYD_MAX_CLIENTS:-5}
      TTYD_CHECK_ORIGIN: ${TTYD_CHECK_ORIGIN:-1}
    volumes:
      # 마운트 범위 = workspace + cli-auth 만 (v3 §7 · ADR-0008). fleet-data 는 마운트하지 않는다.
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: volume
        source: cli-auth
        target: /home/node
    # 주의 1) ports: 없음 — ttyd 는 Docker 내부망에서만 도달, 공개 경로는 터널+Access 뿐.
    # 주의 2) host Docker 소켓(/var/run/docker.sock) 미마운트 — 데몬 접근 = 사실상 host root(ADR-0008).
    healthcheck:
      test:
        - CMD-SHELL
        - 'c=$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7681); [ "$$c" = "200" ] || [ "$$c" = "401" ]'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fleet-net

  fleet:
    # 문② 오케스트레이션 서버(#197-B6). 코어 엔진 + renderer 정적 서빙 + WS 전송. 비특권 node·시크릿 env 주입만.
    build:
      context: ..
      dockerfile: deploy/fleet/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        CLAUDE_VERSION: ${CLAUDE_VERSION:-2.1.199}
        CODEX_VERSION: ${CODEX_VERSION:-0.142.5}
        GEMINI_VERSION: ${GEMINI_VERSION:-0.49.0}
    image: fleet-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true # tini = PID1 → 좀비 수거·시그널 전달
    environment:
      # access 모드 필수 — FLEET_HOST=0.0.0.0(컨테이너 내부망 도달)은 access env 완비 시에만 부팅 통과
      # (resolveBindHost 이중 게이트). 미완비면 loud-fail(조용한 loopback 강등 아님).
      FLEET_HOST: ${FLEET_HOST:-0.0.0.0}
      FLEET_PORT: ${FLEET_PORT:-8791}
      FLEET_SECRET_KEY: ${FLEET_SECRET_KEY} # API 키 영속 암호화(AES-256-GCM env-key). 미설정 시 라이브 세션만.
      FLEET_ACCESS_TEAM_DOMAIN: ${FLEET_ACCESS_TEAM_DOMAIN} # https://<team>.cloudflareaccess.com
      FLEET_ACCESS_AUD: ${FLEET_ACCESS_AUD} # Access application audience tag
      FLEET_PUBLIC_ORIGIN: ${FLEET_PUBLIC_ORIGIN} # https://fleet.<domain>
    volumes:
      # fleet-data = 서버 전용(세션/이벤트/암호문) — 이 서비스에만 마운트(ttyd 셸엔 미노출). 0700 은 서버가 런타임 강제(T5).
      - type: volume
        source: fleet-data
        target: /app/fleet-data
      # cli-auth = 문①과 공유(#195 실측: 동시 사용 간섭 없음 · refresh 로테이션 경합은 README 잔여 리스크).
      - type: volume
        source: cli-auth
        target: /home/node
      # workspace = 두 문이 공유하는 프로젝트 폴더.
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
    # 주의 1) ports: 없음 — 공개 경로는 터널+Access 뿐(cloudflared 내부망 도달).
    # 주의 2) host Docker 소켓 미마운트 — 데몬 접근 = 사실상 host root(ADR-0008).
    healthcheck:
      # 정적 200(loopback 도달) — Access MFA 는 터널 엣지, 내부 healthcheck 는 무인증 app shell 확인.
      test:
        - CMD-SHELL
        - 'curl -fsS -o /dev/null "http://127.0.0.1:${FLEET_PORT:-8791}/"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - fleet-net

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.6.1}
    profiles:
      - tunnel
    restart: unless-stopped
    # 토큰 기반(원격 관리): ingress·Access 는 Zero Trust 대시보드에서 설정, 컨테이너는 무상태.
    # 대시보드 Public Hostname 을 두 문에 각각 매핑: http://ttyd:7681(문①) · http://fleet:8791(문②).
    # 토큰은 argv(`docker ps`/inspect 노출·로그 붙여넣기 유출) 대신 env 로 — cloudflared 가 자동 소비.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - ttyd
      - fleet
    # cloudflared 에는 어떤 볼륨/소켓도 마운트하지 않는다(토큰만 있으면 된다).
    networks:
      - fleet-net

networks:
  fleet-net:
    driver: bridge

volumes:
  cli-auth:
  fleet-data:
