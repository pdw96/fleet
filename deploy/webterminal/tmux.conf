# Fleet 웹터미널 tmux 설정 (Phase A · #195). 시스템 경로(/etc/tmux.conf) — cli-auth 볼륨 밖이라
# 이미지 갱신 시 드리프트가 없다. 목표: 브라우저 탭 닫힘/폰 화면 꺼짐에도 세션 생존, 재접속 시
# 같은 화면 복귀, 모바일 사용성.

set -g mouse on              # 스크롤·창/패널 선택·드래그 리사이즈 (폰 필수)
set -g history-limit 50000   # 폰에서 위로 훑어보기용 큰 스크롤백
set -sg escape-time 10       # 고지연 모바일 링크에서 ESC/화살표 지연 제거
set -g focus-events on

# 여러/재접속 클라이언트에서 창 크기: 최신 클라이언트를 따라간다(stale 클라이언트에 clamp 방지).
set -g window-size latest
setw -g aggressive-resize on

# 색상: ttyd/xterm.js 는 TERM=xterm-256color 를 준다 → truecolor 통과.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 클립보드: OSC52 로 브라우저/폰 클립보드에 복사.
set -g set-clipboard on

set -g status-interval 5
# NOTE: `set utf8 on` 은 tmux 2.1 이후 제거됨 — 넣지 말 것. UTF-8 은 LANG(이미지 ENV)에서 자동 감지.
