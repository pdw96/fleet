appId: dev.pdw96.fleet
productName: Fleet
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: pdw96
  repo: fleet
  releaseType: draft
win:
  target: nsis
nsis:
  # 공백 없는 산출물명(Fleet-Setup-<ver>.exe) — electron-updater latest.yml 의 %20 URL 인코딩 회귀 회피.
  artifactName: '${productName}-Setup-${version}.${ext}'
linux:
  target: AppImage
  category: Development
toolsets:
  appimage: '1.0.3'
