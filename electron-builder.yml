appId: dev.pdw96.fleet
productName: Fleet
directories:
  output: dist
files:
  - out/**
  - '!out/server/**' # 서버 번들은 컨테이너 전용(B6 deploy) — 데스크톱 asar 에 싣지 않는다
  - package.json
asar: true
# 채널별 업데이트 피드 생성(#98) — 안정=latest.yml, 베타(x.y.z-beta.N)=beta.yml.
# electron-updater 가 autoUpdater.channel 로 베타 스트림을 읽으려면 채널별 yml 산출이 필요하다.
generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: pdw96
  repo: fleet
  releaseType: draft
win:
  target: nsis
nsis:
  # 공백 없는 산출물명(Fleet-Setup-<ver>.exe) — electron-updater latest.yml 의 %20 URL 인코딩 회귀 회피.
  artifactName: '${productName}-Setup-${version}.${ext}'
linux:
  target: AppImage
  category: Development
toolsets:
  appimage: '1.0.3'
