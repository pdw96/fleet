# Dependabot version updates. 보안 업데이트(alerts 기반)는 레포 설정에서 별도 ON.
# 정책: 마이너/패치는 주간 1 PR로 묶고(봇 자동), 메이저(electron/vite/vitest 등)는
# 그룹 밖이라 개별 PR로 분리 → #27/#98 수동 트랙에서 적대검증 후 머지.
# 예외: @types/node 메이저는 차단(아래 ignore) — 타입은 출하 런타임(Electron 42.4.1 = Node
# 24.16.0)의 Node 메이저에 맞춰 ^24 고정. 그 위(25/26+) 메이저는 typecheck 통과·런타임 크래시
# footgun → Electron 이 실제로 Node 메이저를 올릴 때 수동 동반 번프.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'area:devx'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # 출하 런타임(Electron 42.4.1 = Node 24.16.0)에 맞춰 @types/node ^24 고정.
      # 마이너/패치(24.x)는 그룹으로 계속 추적, 메이저(25/26+)만 차단.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # TypeScript 메이저(7+) 차단 — 두 개의 독립 차단 요인이 동시에 성립한다(#231).
      # (1) 발행된 모든 typescript-eslint(8.62~8.65·캐너리 포함)의 peer 가
      #     `>=4.8.4 <6.1.0` 이라 TS7 과 공존 불가 → `npm ci` 가 ERESOLVE 로 하드 실패.
      # (2) TS7 은 프로그래매틱 API 를 싣지 않는다(`exports["."]` → `lib/version.cjs`,
      #     노출은 version·versionMajorMinor 뿐). `scripts/brain/extract.mjs` 가
      #     `ts.createSourceFile`/`ts.SyntaxKind` 를 쓰므로 `brain:check` 게이트가 크래시.
      # 해제 조건은 AND 다 — typescript-eslint peer 상한 이탈 **그리고** 안정 API(7.1+)로
      # extract.mjs 이식 가능. 둘 중 하나만으론 부족하다.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # vite / @vitejs/plugin-react 메이저 차단 — 차단 요인은 우리 코드가 아니라 electron-vite 다(#261).
      # plugin-react 6.x 의 peer 는 `vite ^8.0.0` 하나뿐인데, 유일한 stable 인
      # electron-vite@5.0.0 의 peer 는 `vite ^5.0.0 || ^6.0.0 || ^7.0.0` 라 vite 8 을 배제한다
      # → `npm ci` 가 ERESOLVE 로 하드 실패(#261 의 CI red 3잡이 정확히 이것).
      # vitest 4 는 이미 `vite ^8` 를 허용하므로 단일 블로커는 electron-vite 하나다.
      # **둘 다 막아야 결정이 구현된다**: `vite` 도 직접 devDependency 라 위 그룹(minor/patch)
      # 밖의 메이저 제안이 별도 PR 로 열리고, 그 PR 도 같은 이유로 ERESOLVE 다 — 한쪽만
      # 막으면 회수하려던 슬롯을 다시 점유당한다.
      # ⚠ peer 만 무력화(--legacy-peer-deps 등)하면 **빌드는 green 인데 electron 이 인라인돼
      # 죽은 앱**이 나온다 — `npm run verify` 의 build 게이트가 못 잡는 유형이다(실측 재현).
      # 해제 조건(electron-vite stable 의 `vite ^8` peer)·해제 커밋의 필수 4단계·후속 선택 1건은
      # docs/adr/0015-vite-8-차단-electron-vite-미지원.md 가 권위다. 해제 전 반드시 읽을 것.
      # 해제 커밋은 **아래 두 ignore 항목과 이 주석 제거로 시작**한다(안 지우면 다음 7.x 메이저까지
      # 계속 숨겨져 「메이저는 개별 PR 로 적대검증」 정책으로 복귀하지 못한다).
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'area:devx'
    commit-message:
      prefix: 'chore(deps)'
