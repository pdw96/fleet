# Dependabot version updates. 보안 업데이트(alerts 기반)는 레포 설정에서 별도 ON.
# 정책: 마이너/패치는 주간 1 PR로 묶고(봇 자동), 메이저(electron/vite/vitest 등)는
# 그룹 밖이라 개별 PR로 분리 → #27/#98 수동 트랙에서 적대검증 후 머지.
# 예외: @types/node 메이저는 차단(아래 ignore) — 타입은 출하 런타임(Electron 42.4.1 = Node
# 24.16.0)의 Node 메이저에 맞춰 ^24 고정. 그 위(25/26+) 메이저는 typecheck 통과·런타임 크래시
# footgun → Electron 이 실제로 Node 메이저를 올릴 때 수동 동반 번프.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'area:devx'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # 출하 런타임(Electron 42.4.1 = Node 24.16.0)에 맞춰 @types/node ^24 고정.
      # 마이너/패치(24.x)는 그룹으로 계속 추적, 메이저(25/26+)만 차단.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # TypeScript 메이저(7+) 차단 — 두 개의 독립 차단 요인이 동시에 성립한다(#231).
      # (1) 발행된 모든 typescript-eslint(8.62~8.65·캐너리 포함)의 peer 가
      #     `>=4.8.4 <6.1.0` 이라 TS7 과 공존 불가 → `npm ci` 가 ERESOLVE 로 하드 실패.
      # (2) TS7 은 프로그래매틱 API 를 싣지 않는다(`exports["."]` → `lib/version.cjs`,
      #     노출은 version·versionMajorMinor 뿐). `scripts/brain/extract.mjs` 가
      #     `ts.createSourceFile`/`ts.SyntaxKind` 를 쓰므로 `brain:check` 게이트가 크래시.
      # 해제 조건은 AND 다 — typescript-eslint peer 상한 이탈 **그리고** 안정 API(7.1+)로
      # extract.mjs 이식 가능. 둘 중 하나만으론 부족하다.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @vitejs/plugin-react 메이저(6+) 차단 — 차단 요인은 우리 코드가 아니라 electron-vite 다(#261).
      # plugin-react 6.x 의 peer 는 `vite ^8.0.0` 하나뿐인데, 유일한 stable 인
      # electron-vite@5.0.0 의 peer 는 `vite ^5.0.0 || ^6.0.0 || ^7.0.0` 라 vite 8 을 배제한다.
      # → `npm ci` 가 ERESOLVE 로 하드 실패(#261 의 CI red 3잡이 정확히 이것).
      # vite 8 을 지원하는 유일한 빌드는 electron-vite@6.0.0-beta.1 인데, 2026-04-12 에 발행된 뒤
      # 2026-08-10 현재까지 신규 발행이 없다(dist-tags: latest=5.0.0 · beta=6.0.0-beta.1).
      # 게다가 오픈 버그 alex8088/electron-vite#906 이 `vite:esm-shim` 으로 main 엔트리를 0.00 kB 로
      # 비운다 — 정확히 Fleet 의 main 타깃이다. 더 위험한 건 electron-vite@5 + vite 8 강제 조합이
      # **빌드는 green 인데 electron 이 외부화되지 않고 인라인돼 죽은 앱을 산출**한다는 점으로,
      # `npm run verify` 의 build 게이트가 못 잡는 유형이다(실측 재현).
      #
      # 해제 조건: electron-vite 가 **stable**(dist-tag `latest`) 로 `vite ^8` peer 를 선언
      # (업스트림 #894 종결 + #906 수정). 그때 아래를 한 커밋으로 동반 처리한다.
      #  (1) vite 7→8 · electron-vite 5→6 · @vitejs/plugin-react 5→6 동반 범프.
      #  (2) **외부화를 산출물에서 정적 검증**(결정적). 빌드 후 아래가 성립해야 한다.
      #        out/main/index.js    → `require("electron")` **와** `require("electron-updater")`
      #        out/preload/index.js → `require("electron")`
      #      `electron.vite.config.ts:10` 이 명시 외부화하는 건 `electron-updater` 하나뿐이고
      #      **`electron` 자체는 electron-vite 의 자동 처리에 의존**한다. 위에 적은 실측 실패
      #      모드가 정확히 「electron 이 main 번들에 인라인」이라, updater 만 확인하면 같은 회귀를
      #      놓친다. vite 8 은 외부화 모듈의 `require` 를 `import` 로 변환하지 않고 보존하므로
      #      외부화 결과 자체가 달라질 수 있다. vite.server.config.ts 의 SSR 번들도 같이 볼 것.
      #      ⚠ `npm run test:e2e` 로는 이 축을 못 잡는다 — e2e 는 `FLEET_E2E=1` 로 unpackaged
      #      기동이라 `installAutoUpdate` 가 무장되지 않아(src/main/index.ts:269-274) updater
      #      경로를 아예 타지 않는다. 인라인된 번들이 우연히 기동하면 통과한다. e2e 는 기동
      #      검증으로 **병행**하되, 외부화 판정의 근거는 위 정적 검사다.
      #  (3) esbuild 하한 **감사**(단순 삭제 아님). 현재 esbuild 인스턴스는 2개다 —
      #      `vite/node_modules/esbuild`(override 적용) 와 `node_modules/esbuild`
      #      (electron-vite 의 `^0.25.11` · **override 미적용**). vite 8 이 esbuild 의존을 버리면
      #      `overrides.vite.esbuild` 는 그냥 무효 키가 될 뿐이고, 키를 지우는 것 자체는 보안
      #      하한 유지가 아니다. 락파일의 **전체 esbuild 그래프**를 확인해 필요한 하한을 전역
      #      또는 실제 부모에 다시 적용할 것. 인스턴스가 하나도 없을 때만 키 삭제는 단순 정리다.
      #  (4) [deprecation 정리 · 필수 아님] `build.rollupOptions`(electron.vite.config.ts 3곳 +
      #      vite.server.config.ts 1곳) → `build.rolldownOptions`. vite 8 은 `setupRollupOptionCompat`
      #      으로 구 이름을 프록시 별칭으로 유지해 동작은 계속되지만 향후 제거 예정이다.
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'area:devx'
    commit-message:
      prefix: 'chore(deps)'
