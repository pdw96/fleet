name: CI

on:
  push:
    branches: [master]
  pull_request:

# 동일 ref 의 이전 실행은 취소(최신 커밋만 검증).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: skills:lint (경로·시크릿 게이트)
        run: |
          shopt -s globstar
          node scripts/skills-lint.mjs .claude/*.md .claude/skills/**/*.md .claude/workflows/**/*.js .github/workflows/*.yml .github/workflows/*.yaml docs/adr/**/*.md
        shell: bash

      - name: Format check (prettier)
        run: npm run format:check

      - name: Test (vitest)
        run: npm test

      # 산출물 생성 = 기동 가능성 smoke (DESIGN.md §12).
      - name: Build (smoke)
        run: npm run build

  # Windows 전용 보안 회귀(`.cmd` 셰임 명령주입·프로세스 트리 킬)는 `describe.skipIf(platform!=='win32')`
  # 로 보호돼 ubuntu 단일 게이트에서 영구 skip 된다. 이 잡이 windows 러너에서 vitest 를 돌려 실제로 검증한다.
  # typecheck/lint/build 는 플랫폼 무관이라 위 ubuntu 잡으로 충분 — 여기선 test 만(중복 회피).
  windows-tests:
    name: windows vitest (win32 보안 회귀)
    runs-on: windows-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # vitest 는 electron 바이너리가 필요 없다(테스트는 electron 모듈을 import 하지 않음, build 도 안 함).
      # ELECTRON_SKIP_BINARY_DOWNLOAD 로 ~150MB 다운로드를 건너뛰어 설치 지연·네트워크 flakiness 를 없앤다.
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test (vitest — win32 .cmd 셰임·트리 킬 회귀 실행)
        run: npm test

# NOTE: E2E(test:e2e)는 electron 빌드 + playwright 로 느리고 환경 의존이 커
# 이 게이트에 넣지 않는다. 필요 시 별도 워크플로(스케줄/수동 dispatch)로 분리한다.
