name: CI

on:
  push:
    branches: [master]
  pull_request:

# 동일 ref 의 이전 실행은 취소(최신 커밋만 검증).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 두 잡 모두 checkout + 테스트/빌드만(쓰기·PR·packages 미사용) — 최소권한 읽기 전용.
# 미명시 시 리포 기본 토큰 권한을 광범위 상속 → CodeQL actions/missing-workflow-permissions 경고.
permissions:
  contents: read

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # 품질 게이트 6종 + brain.md 신선도를 단일 집계(`npm run verify`)로 실행 — 로컬과 CI 가
      # byte-for-byte 동일해 drift 가 원천 차단된다(#175). skills:lint 는 무인자 자립(내부 글롭)이라
      # bash globstar 가 불필요. 잡 표시명 `typecheck · lint · test · build` 는 master ruleset
      # required status check 이름이므로 절대 바꾸지 않는다(이름만 유지, 실행은 verify 로 단일화).
      - name: Verify (skills:lint·brain:check·format:check·typecheck·lint·test·build smoke)
        run: npm run verify

  # Windows 전용 보안 회귀(`.cmd` 셰임 명령주입·프로세스 트리 킬)는 `describe.skipIf(platform!=='win32')`
  # 로 보호돼 ubuntu 단일 게이트에서 영구 skip 된다. 이 잡이 windows 러너에서 vitest 를 돌려 실제로 검증한다.
  # typecheck/lint/build 는 플랫폼 무관이라 위 ubuntu 잡으로 충분 — 여기선 test 만(중복 회피).
  windows-tests:
    name: windows vitest (win32 보안 회귀)
    runs-on: windows-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # vitest 는 electron 바이너리가 필요 없다(테스트는 electron 모듈을 import 하지 않음, build 도 안 함).
      # ELECTRON_SKIP_BINARY_DOWNLOAD 로 ~150MB 다운로드를 건너뛰어 설치 지연·네트워크 flakiness 를 없앤다.
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test (vitest — win32 .cmd 셰임·트리 킬 회귀 실행)
        run: npm test

  # 출하 런타임 = Electron 42 = Node 24 인데 .nvmrc/CI 기본은 Node 22(dev floor). 이 잡이 Node 24 에서
  # vitest 를 돌려 출하 런타임 고유 회귀를 smoke 한다. matrix 를 quality 잡에 걸면 required check 이름
  # (`typecheck · lint · test · build`)이 `... (22)`/`... (24)` 로 분기해 사라지므로, 별도 잡으로
  # required check 를 보존한다(advisory — required 아님).
  test-node24:
    name: node24 vitest (출하 런타임 smoke)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test (vitest — Node 24 출하 런타임 회귀)
        run: npm test

# NOTE: E2E(test:e2e)는 electron 빌드 + playwright 로 느리고 환경 의존이 커
# 이 게이트에 넣지 않는다. 필요 시 별도 워크플로(스케줄/수동 dispatch)로 분리한다.
