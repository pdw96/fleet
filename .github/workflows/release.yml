name: Release
on:
  push:
    tags:
      - 'v*'
  # 터미널이 없는 운용 환경(브라우저만)에서도 출하를 개시할 수 있어야 한다 — 태그 push 가
  # 불가능한 상황에서 파이프라인 전체가 인질이 되면 ADR-0021 이 없애려던 「낼 수 없어서 안 냄」이
  # 그대로 재현된다. 이 경로는 **태그 ref 만** 만든다(`prepare` 의 「태그 ref 보장」 스텝) —
  # 릴리스를 발행하지 않으므로 AGENTS.md 1항의 실제 불변식(「electron-builder 가 도착했을 때
  # 공개된 릴리스가 없을 것」)은 그대로다. git push 로 태그를 미는 것과 동형이다.
  workflow_dispatch:
    inputs:
      tag:
        description: '출하할 태그 (예: v0.1.2). 「Use workflow from」에서 고른 브랜치의 package.json 버전과 일치해야 한다.'
        required: true
        type: string
permissions:
  contents: write
jobs:
  # 매트릭스 publish 전에 draft 릴리스를 한 곳에서 미리 생성 — 동시 생성 race 방지(P2-D),
  # prerelease 태그(v*-*) 는 생성 시점에 prerelease 로 표시(P2-E).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # dispatch 경로에서 `github.ref` 는 브랜치다 — 그대로 두면 prepare 가 태그를 붙인 커밋과
          # build 가 빌드한 커밋이 갈릴 수 있다(그 사이 브랜치에 push 가 들어오면). 그래서 SHA 로 고정.
          #
          # push 경로는 **빈 문자열 = checkout 기본값**이다. `github.ref` 를 명시하는 것과 다르다:
          # 기본값은 내부적으로 `github.sha`(이벤트에 기록된 커밋)를 체크아웃하는 반면, ref 이름을
          # 넘기면 checkout 시점의 **원격 태그가 현재 가리키는 곳**을 다시 해석한다. 이벤트 후
          # 태그가 강제 갱신·재생성되면 두 잡이 교체된 커밋을 빌드하는데 워크플로와 릴리스는 원래
          # push 를 나타낸다(Codex P1). 즉 ref 이름 명시는 무변경이 아니라 **고정 해제**다 —
          # 「push 경로를 건드리지 않는다」의 올바른 표현은 생략이다.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # 이후 모든 잡·스텝은 `GITHUB_REF_NAME` 이 아니라 이 출력을 쓴다 — dispatch 경로에서
      # `GITHUB_REF_NAME` 은 브랜치명이라 태그가 아니다. `inputs` 컨텍스트가 push 이벤트에서
      # 어떻게 채워지는지는 문서에 명시돼 있지 않으므로 의존하지 않고 `github.event_name` 으로 분기한다.
      # 사용자 입력은 셸에 인라인 보간하지 않고 env 로 넘긴다(주입 차단).
      - name: 태그 결정 (push=ref_name · dispatch=input)
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::태그 형식이 아니다: '$TAG' (예: v0.1.2 · v1.0.0-rc.1)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "출하 태그: $TAG (이벤트: $EVENT_NAME)"
      - name: Verify tag matches package.json version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
      # 두 개시 경로 모두 「지금 고른 것」의 HEAD 를 그대로 태깅한다 — CLI 의 `git tag` 는 어느
      # 브랜치에서든 찍히고, 아래 「태그 ref 보장」은 고른 ref 의 커밋에 태그를 만든다. 즉 머지·리뷰되지
      # 않은 코드가 immutable 공개 릴리스로 나갈 수 있었고, 그것을 막는 것은 사람의 확인뿐이었다
      # (Codex PR#327 3R P1 → #328). 복구는 재출하뿐이다 — v0.1.1 이 이미 그 비용을 치렀다.
      #
      # 판정은 **브랜치 이름이 아니라 포함 관계**로 한다. dispatch 는 고른 ref 이름을 주지만 push 는
      # 태그만 오므로, 두 경로를 하나의 술어로 덮으려면 「이 커밋이 master 에 있는가」여야 한다.
      # 그래서 이 스텝에는 `EVENT_NAME` 분기가 없다 — 한쪽만 덮으면 다른 경로가 그대로 뚫린다.
      #
      # 대상은 `$GITHUB_SHA` 가 아니라 **워크트리의 HEAD** 다. 이유는 「GITHUB_SHA 가 무엇인가」에
      # 답하기 위해서가 아니라 **그 물음에 의존하지 않기 위해서**다 — checkout 이 무엇을 해석했든
      # 체크아웃된 워크트리의 HEAD 는 커밋이다. 그리고 build 잡의 checkout `ref:` 식이 이 잡과 같으므로
      # 그것이 곧 **실제로 빌드되는 커밋**이다.
      # ⚠ 「빌드되는 커밋」까지다. 발행 시점에 태그가 가리키는 곳은 별개다 — `release` 잡은 태그
      # **이름**으로 발행하므로, 이 게이트 통과 후 태그가 강제 갱신되면 자산과 태그가 갈릴 수 있다.
      # 그 창(태그 스왑 윈도우)은 이 게이트가 닫는 것이 아니라 태그 ruleset 이 닫을 별건이다.
      #
      # compare 의 `status` 는 base=master 기준 4값이다(REST 스키마: diverged|ahead|behind|identical.
      # 실측 2026-09-09 pdw96/fleet: 같은 커밋 identical · master 위 옛 커밋 behind · 특성 브랜치 diverged).
      # 통과는 앞의 둘뿐 — `ahead` 는 master 의 **자손**이라 아직 머지되지 않았다.
      # ⚠ `behind`(= master 의 조상) 허용은 **squash 머지 관례에 기댄다**(AGENTS.md 「백로그 착수 절차」).
      # squash 아래서는 master 의 조상 = master 자신의 커밋열이라 「포함 == 리뷰됨」이 성립한다.
      # 머지 커밋이나 master 직접 push 가 들어오면 그 등가가 깨지므로, 그때 이 arm 을 재검토할 것.
      #
      # ⚠ **이 게이트의 한계 — 자기가 판정할 커밋 안에 산다.** Actions 는 개시자가 고른 ref/커밋의
      # 워크플로 파일을 실행하므로(dispatch = 「Use workflow from」의 브랜치, push = 태그가 붙은 커밋),
      # 이 스텝을 **포함하지 않는** ref 로 개시하면 게이트도 함께 없다. 트리 밖 강제(태그 ruleset)가
      # 아니면 닫히지 않는 잔여 공백이고, 그래서 AGENTS.md 1항의 사람 확인은 폐기하지 않았다.
      - name: 출하 커밋 master 포함 확인 (미머지 코드 출하 차단)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # base 해석 실패(기본 브랜치 이름 변경·커밋 부재)와 「포함되지 않음」을 구분해서 낸다 —
          # 합치면 릴리스가 막힌 원인을 오도한다. 어느 쪽이든 판정 불가이므로 fail-closed 다.
          if ! STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$SHA" -q .status); then
            echo "::error::master 와 $SHA 를 비교하지 못해 판정할 수 없다 — 중단한다."
            echo "::error::기본 브랜치가 master 가 아니게 바뀌었거나(이 스텝은 master 를 하드코딩한다: 이름 변경 시 조용히 느슨해지는 대신 멈추도록 한 선택이다), 커밋이 이 레포에 없다."
            exit 1
          fi
          case "$STATUS" in
            identical|behind)
              echo "출하 커밋 $SHA 는 master 에 포함된다 (compare=$STATUS)"
              ;;
            *)
              echo "::error::출하 커밋 $SHA 가 master 에 없다 (compare=$STATUS) — 머지·리뷰되지 않은 코드다."
              echo "::error::릴리스는 immutable 이라 잘못 나가면 되돌릴 수 없다. 복구는 재출하뿐이다(v0.1.1 선례)."
              echo "::error::태그 push 로 개시했다면 잘못된 태그가 이미 원격에 있다. 먼저 지워라 — 지우지 않으면 재개시가 'Everything up-to-date' 로 조용히 no-op 이 되고 dispatch 경로도 「태그 ref 보장」에서 막힌다: git push --delete origin $TAG"
              echo "::error::그다음 master 에서 개시한다 — git push origin $TAG, 또는 Actions 「Run workflow」의 「Use workflow from」을 master 로 고를 것 (AGENTS.md 「릴리스 절차」 1항)."
              exit 1
              ;;
          esac
      # dispatch 경로에는 태그가 아직 없다. 여기서 만든다 — 이 시점 이후로는 두 경로가 완전히 같다.
      #
      # ⚠ **이 스텝 전체가 dispatch 전용이다.** push 경로에서는 태그가 정의상 이미 존재하고 어느 커밋을
      # 가리키는지는 git 이 이미 결정했으므로 검증할 것이 없다. 그런데도 SHA 를 대조하면 **정상 출하를
      # 막는 오탐** 위험만 진다: 문서는 push 의 `GITHUB_SHA` 를 「Tip commit pushed to the ref」라고만
      # 하고 annotated 태그에서 그것이 커밋인지 태그 객체인지 단정하지 않는다. 게이트의 실패 비용이
      # 특히 큰 자리라(발행은 immutable) 검증 범위를 실제로 검증할 것이 있는 경로로 좁힌다.
      #
      # dispatch 에서 `GITHUB_SHA` 는 고른 브랜치의 head — 항상 커밋이라 대조가 성립한다. 태그가 이미
      # 다른 커밋을 가리키면 하드 실패한다: 태그가 가리키지 않는 커밋을 그 태그로 발행하는 것이 이
      # 경로 고유의 최악 실패다.
      #
      # 존재 확인은 `refs/tags/<TAG>` **정확히 그것만** 본다. `commits/<ref>` 는 같은 이름의
      # **브랜치**도 해석하므로, 태그가 없는데 동명 브랜치가 있고 그 head 가 이 실행의 커밋이면
      # 생성을 조용히 건너뛴다. 그러면 뒤의 `gh release create` 가 문서화된 동작대로 —「If a matching
      # git tag does not yet exist, one will automatically get created from the latest state of the
      # default branch」— **기본 브랜치 최신 상태에서 태그를 날조**해, 빌드한 커밋과 다른 커밋에 태그가
      # 붙은 채 자산이 발행된다(Codex P1). 대신 annotated 태그는 `object` 가 커밋이 아니라 태그
      # 객체이므로 한 번 벗겨서 비교한다. 같은 구멍을 `gh release create --verify-tag` 로 이중으로 막는다.
      #
      # 참고: 여기서 만든 ref 는 `push: tags` 를 다시 띄우지 않는다 — GITHUB_TOKEN 이 만든 이벤트는
      # 워크플로를 트리거하지 않는다(재귀 방지, 예외는 `workflow_dispatch`·`repository_dispatch` 뿐).
      # 중복 실행도, 두 run 이 같은 draft 를 만지는 경합도 없는 것은 우연이 아니라 이 규칙 덕이다.
      - name: 태그 ref 보장 (dispatch 개시 경로 전용)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "push 개시 — 태그 $TAG 는 이미 존재한다. 생성·대조 불요."
            exit 0
          fi
          REF_API="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if OBJ_TYPE=$(gh api "$REF_API" -q .object.type 2>/dev/null); then
            EXISTING=$(gh api "$REF_API" -q .object.sha)
            if [ "$OBJ_TYPE" = "tag" ]; then
              # annotated — 태그 객체를 한 번 벗겨 커밋을 얻는다.
              EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$EXISTING" -q .object.sha)
            fi
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::태그 $TAG 는 이미 $EXISTING 를 가리킨다 — 이 실행이 빌드하는 커밋($GITHUB_SHA)과 다르다."
              echo "::error::태그가 가리키지 않는 커밋을 그 태그로 발행할 뻔했다. 중단한다."
              exit 1
            fi
            echo "태그 $TAG 가 이미 $GITHUB_SHA 를 가리킨다 — 생성 생략"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "태그 $TAG → $GITHUB_SHA 생성"
      # 재사용 경로는 **draft 일 때만** 유효하다. 이미 공개된 릴리스가 있으면 electron-builder 의
      # `releaseType: draft` 가 자산 업로드를 거부하는데, 그걸 **경고로만** 내고 exit 0 한다
      # (`reason=existing type not compatible with publishing type`). v0.1.1 이 그래서 4개 잡 전부
      # 초록인 채 **자산 0개**로 발행됐다 — 태그를 git push 가 아니라 웹 UI 릴리스 발행으로 만든 것이
      # 원인이고, 이 재사용 경로가 그것을 조용히 통과시켰다. immutable releases 가 켜져 있어 사후
      # 자산 추가도 태그 이름 재사용도 불가능해, 유일한 복구는 다음 버전 재출하였다(v0.1.2).
      # → 발행된 릴리스를 만나면 여기서 하드 실패한다. 실패는 되돌릴 수 있지만 발행은 못 되돌린다.
      - name: Create draft release (idempotent; prerelease if tag has a -segment)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if EXISTING_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$EXISTING_DRAFT" != "true" ]; then
              echo "::error::Release $TAG 이 이미 **공개**(draft=false) 상태다."
              echo "::error::electron-builder(releaseType: draft)는 공개 릴리스에 자산을 올리지 않고 조용히 건너뛴다 — 자산 0개 릴리스가 된다."
              echo "::error::릴리스를 웹 UI 로 발행하지 말 것. 개시는 태그 ref 생성뿐이다: git push origin $TAG, 또는 Actions 「Run workflow」 (AGENTS.md 「릴리스 절차」 1항)."
              exit 1
            fi
            echo "Release $TAG already exists as a draft; reusing"
            exit 0
          fi
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          # `--verify-tag` — 태그가 원격에 없으면 만들지 말고 중단하라. 없이 두면 gh 가 기본 브랜치
          # 최신 상태에서 태그를 날조해(문서화된 동작) 빌드한 커밋과 다른 곳에 태그가 붙는다.
          # 위 「태그 ref 보장」이 이미 막지만, 그 스텝이 사라지거나 조건이 어긋나도 여기서 fail-closed.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE

      # ADR-0017 이 미서명을 고르며 **경고 우회 안내를 유일한 완화책**으로 못 박았다. 그런데 자동 생성
      # 노트(--generate-notes)는 그 안내를 합성해 주지 않으므로, 사용자가 실제로 착지하는 릴리스
      # 페이지엔 안내가 없었다(Codex PR#313 P1). 여기서 푸터로 명시 append 한다.
      # ⚠ `--notes` + `--generate-notes` 의 합성 순서는 gh 문서에 명시돼 있지 않아 의존하지 않는다 —
      # 문서화된 플래그만 쓴다(`release view --json body` 로 읽고 `release edit --notes-file` 로 쓴다).
      # prepare 는 재실행 가능해야 하므로(위 reuse 경로) 마커로 중복 append 를 막는다.
      - name: Append 설치·경고 우회 안내 푸터 (미서명 완화책 — ADR-0017)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          MARKER='<!-- fleet-install-footer -->'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          if grep -qF "$MARKER" notes.md; then
            echo "설치 안내 푸터가 이미 있음 — 건너뜀"
            exit 0
          fi
          README="https://github.com/$GITHUB_REPOSITORY/blob/$TAG/README.md#설치-사용자"
          cat >> notes.md <<EOF

          ---

          $MARKER
          ### 설치 안내

          **지원 OS: Windows · Linux.** 설치 절차·전제조건·첫 실행은 [README 설치 절]($README) 참조.

          이 빌드는 **코드서명이 없다.** 그래서 OS 가 설치를 막는다:

          - **Windows**: SmartScreen 이 *"Windows에서 PC를 보호했습니다"* 를 띄운다 → **「추가 정보」 → 「실행」**
          - **Linux**: \`chmod +x Fleet-*.AppImage\` 후 실행

          출처 검증(인스톨러 자산 한정): \`gh attestation verify <파일> --repo $GITHUB_REPOSITORY\`

          ### ⚠ 알려진 제약 (0.1.x)

          - **워크스페이스는 npm 프로젝트여야 합니다.** 검증 단계가 \`npm run typecheck\`·\`lint\`·\`test\`
            로 고정돼 있어, Python·Go·Rust·빈 폴더에서는 모든 작업이 성공해도 프로젝트가 「검증 실패」로
            끝납니다. 게다가 자동 수정 라운드가 그 실패를 고치려다 **워크스페이스에 \`package.json\` 을
            만들어 넣을 수 있습니다.** JS/TS 저장소가 아니라면 이 버전은 권장하지 않습니다(추적: #300).
          - 프로젝트 실행에는 구독형 CLI(\`claude\`/\`codex\`/\`gemini\`) 최소 1개가 필요합니다 — API 키만으로는
            실행되지 않습니다.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  build:
    needs: prepare
    # build 잡은 attestation 용 id-token/attestations(write)가 추가로 필요한데, job-level permissions 를
    # 선언하면 미명시 스코프가 none 으로 떨어진다. electron-builder --publish always 는 GH_TOKEN
    # (=secrets.GITHUB_TOKEN = 잡 토큰)으로 Release 에 자산을 업로드하므로 contents:write 를 반드시 유지한다
    # (read 로 내리면 "Resource not accessible by integration" 으로 publish 실패 — Codex P1). checkout 도 write 가 충족.
    permissions:
      contents: write # electron-builder --publish always 자산 업로드 + checkout (GITHUB_TOKEN 스코프)
      id-token: write # sigstore OIDC 서명 토큰 (attest-build-provenance 필수)
      attestations: write # attestations API 기록 (필수)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # prepare 와 같은 커밋을 본다 — 근거는 prepare 잡의 같은 줄 주석 참조.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # draft 가 이미 존재하므로 electron-builder 는 생성하지 않고 자산만 업로드.
      # prerelease 태그(v*-beta*/-alpha*)는 publish 채널을 명시한다 — GitHub provider 는 버전 태그에서
      # 채널을 추론하지 않으므로(electron-builder 문서), 명시 없이는 beta 클라이언트(autoUpdater.channel=beta)가
      # 읽을 beta.yml 이 잘못 발행된다(#98). stable 태그는 인자 없이 기존 경로 유지(무영향).
      - name: Publish (prerelease 는 채널 명시)
        shell: bash
        run: |
          CHANNEL_ARG=""
          case "$TAG" in
            *-beta*) CHANNEL_ARG="-c.publish.channel=beta" ;;
            *-alpha*) CHANNEL_ARG="-c.publish.channel=alpha" ;;
            # `-rc` 와 그 외 **모든** 프리릴리스 식별자(`v1.2.3-<id>`)는 **beta 피드**로 보낸다.
            # 두 가지를 동시에 만족해야 한다(Codex 2R·3R P1):
            #  ① stable 피드(latest.yml)를 갱신하지 않을 것 — prepare 잡의 `--prerelease` 판정은 `*-*`
            #     인데 여기만 beta/alpha 열거라, 열거 밖 태그(`-rc`)가 채널 인자 없이 stable 을 갱신했다.
            #     ADR-0018 이 `v1.0.0-rc.1` 을 처방하므로 가정이 아니라 예정된 경로였다.
            #  ② **읽는 클라이언트가 존재할 것** — 앱의 채널은 `stable | beta` 둘뿐이고
            #     (`shared/types.ts` `UpdaterChannel`) `auto-update.ts` 의 `feedChannel` 은
            #     latest.yml / beta.yml 만 매핑한다. `rc.yml` 같은 새 채널은 아무도 읽지 않아
            #     격리가 아니라 **배달 불가**가 된다 — "프리릴리스 포함"을 opt-in 한 beta 사용자조차
            #     RC 를 못 받는다. 프리릴리스의 수신 대상이 곧 beta 코호트이므로 beta 로 보낸다.
            # (`-alpha` 는 기존 동작 유지 — 같은 무소비자 문제가 있으나 이 PR 범위 밖이다.)
            *-*) CHANNEL_ARG="-c.publish.channel=beta" ;;
          esac
          npx electron-builder --publish always $CHANNEL_ARG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
      # 산출물 서명: electron-builder 가 dist/ 에 설치본을 만든 직후 build provenance attestation 생성.
      # 매트릭스 레그별로 자기 OS 산출물만 가리킨다(win=*.exe / linux=*.AppImage) — 0-match 면 액션 실패라
      # OS 조건부 subject-path 필수. *.exe 는 .exe.blockmap·latest.yml 을 매치하지 않아 레그당 정확히 1개.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ matrix.os == 'windows-latest' && 'dist/*.exe' || 'dist/*.AppImage' }}

  # 양 플랫폼 build 가 모두 성공해 draft 에 자산을 올린 뒤에만 공개(부분 릴리스 노출 방지).
  release:
    # `prepare` 를 needs 에 넣는 것은 순서 때문이 아니라(build 가 이미 의존한다) 그 출력(tag)을
    # 참조하기 위해서다 — needs 에 없는 잡의 outputs 는 읽을 수 없다.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # `needs: build` 는 **잡의 성공**만 보증한다. electron-builder 는 업로드를 건너뛰고도 exit 0 하므로
      # (위 prepare 주석 참조) 잡 성공이 자산 존재를 뜻하지 않는다 — v0.1.1 이 그 구멍으로 나갔다.
      # 공개는 immutable releases 아래에서 되돌릴 수 없으니, 공개 **전에** 자산을 직접 센다.
      # 채널별 파일명(latest/beta/alpha)을 열거하지 않고 부류로 판정한다 — 채널 라우팅이 바뀌어도
      # 이 게이트는 낡지 않는다(ADR-0016: 범프마다 낡는 열거는 게이트에 넣지 않는다).
      - name: 자산 실재 확인 (공개 전 fail-closed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > assets.txt
          echo "붙은 자산:"
          cat assets.txt
          MISSING=""
          grep -qE '\.exe$' assets.txt || MISSING="$MISSING Windows인스톨러(*.exe)"
          grep -qE '\.AppImage$' assets.txt || MISSING="$MISSING Linux인스톨러(*.AppImage)"
          grep -qE -- '-linux\.yml$' assets.txt || MISSING="$MISSING Linux업데이트메타(*-linux.yml)"
          grep -vE -- '-linux\.yml$' assets.txt | grep -qE '\.yml$' || MISSING="$MISSING Windows업데이트메타(*.yml)"
          if [ -n "$MISSING" ]; then
            echo "::error::릴리스 $TAG 에 자산이 없다 —$MISSING"
            echo "::error::build 잡이 성공했더라도 electron-builder 가 업로드를 건너뛴 것이다. build 잡 로그에서 'reason=' 를 확인할 것."
            echo "::error::draft 를 공개하지 않고 중단한다 — 공개는 immutable 이라 되돌릴 수 없다."
            exit 1
          fi
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
