name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  # 매트릭스 publish 전에 draft 릴리스를 한 곳에서 미리 생성 — 동시 생성 race 방지(P2-D),
  # prerelease 태그(v*-*) 는 생성 시점에 prerelease 로 표시(P2-E).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - name: Create draft release (idempotent; prerelease if tag has a -segment)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing"
            exit 0
          fi
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE

  build:
    needs: prepare
    # OIDC/attestation 권한을 이 잡에만 국소화(top-level contents:write 불변 — prepare/release 의
    # gh release create/edit 가 contents:write 필요). job-level permissions 선언 시 미명시 스코프는
    # none 으로 떨어지므로 checkout·npm ci 용 contents:read 를 반드시 명시.
    permissions:
      contents: read
      id-token: write # sigstore OIDC 서명 토큰 (attest-build-provenance 필수)
      attestations: write # attestations API 기록 (필수)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # draft 가 이미 존재하므로 electron-builder 는 생성하지 않고 자산만 업로드.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 산출물 서명: electron-builder 가 dist/ 에 설치본을 만든 직후 build provenance attestation 생성.
      # 매트릭스 레그별로 자기 OS 산출물만 가리킨다(win=*.exe / linux=*.AppImage) — 0-match 면 액션 실패라
      # OS 조건부 subject-path 필수. *.exe 는 .exe.blockmap·latest.yml 을 매치하지 않아 레그당 정확히 1개.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.os == 'windows-latest' && 'dist/*.exe' || 'dist/*.AppImage' }}

  # 양 플랫폼 build 가 모두 성공해 draft 에 자산을 올린 뒤에만 공개(부분 릴리스 노출 방지).
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
