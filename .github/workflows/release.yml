name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  # 매트릭스 publish 전에 draft 릴리스를 한 곳에서 미리 생성 — 동시 생성 race 방지(P2-D),
  # prerelease 태그(v*-*) 는 생성 시점에 prerelease 로 표시(P2-E).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      # 재사용 경로는 **draft 일 때만** 유효하다. 이미 공개된 릴리스가 있으면 electron-builder 의
      # `releaseType: draft` 가 자산 업로드를 거부하는데, 그걸 **경고로만** 내고 exit 0 한다
      # (`reason=existing type not compatible with publishing type`). v0.1.1 이 그래서 4개 잡 전부
      # 초록인 채 **자산 0개**로 발행됐다 — 태그를 git push 가 아니라 웹 UI 릴리스 발행으로 만든 것이
      # 원인이고, 이 재사용 경로가 그것을 조용히 통과시켰다. immutable releases 가 켜져 있어 사후
      # 자산 추가도 태그 이름 재사용도 불가능해, 유일한 복구는 다음 버전 재출하였다(v0.1.2).
      # → 발행된 릴리스를 만나면 여기서 하드 실패한다. 실패는 되돌릴 수 있지만 발행은 못 되돌린다.
      - name: Create draft release (idempotent; prerelease if tag has a -segment)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if EXISTING_DRAFT=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$EXISTING_DRAFT" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME 이 이미 **공개**(draft=false) 상태다."
              echo "::error::electron-builder(releaseType: draft)는 공개 릴리스에 자산을 올리지 않고 조용히 건너뛴다 — 자산 0개 릴리스가 된다."
              echo "::error::릴리스를 웹 UI 로 만들지 말 것. 태그만 민다: git push origin $GITHUB_REF_NAME (AGENTS.md 「릴리스 절차」 1항)."
              exit 1
            fi
            echo "Release $GITHUB_REF_NAME already exists as a draft; reusing"
            exit 0
          fi
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE

      # ADR-0017 이 미서명을 고르며 **경고 우회 안내를 유일한 완화책**으로 못 박았다. 그런데 자동 생성
      # 노트(--generate-notes)는 그 안내를 합성해 주지 않으므로, 사용자가 실제로 착지하는 릴리스
      # 페이지엔 안내가 없었다(Codex PR#313 P1). 여기서 푸터로 명시 append 한다.
      # ⚠ `--notes` + `--generate-notes` 의 합성 순서는 gh 문서에 명시돼 있지 않아 의존하지 않는다 —
      # 문서화된 플래그만 쓴다(`release view --json body` 로 읽고 `release edit --notes-file` 로 쓴다).
      # prepare 는 재실행 가능해야 하므로(위 reuse 경로) 마커로 중복 append 를 막는다.
      - name: Append 설치·경고 우회 안내 푸터 (미서명 완화책 — ADR-0017)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='<!-- fleet-install-footer -->'
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          if grep -qF "$MARKER" notes.md; then
            echo "설치 안내 푸터가 이미 있음 — 건너뜀"
            exit 0
          fi
          README="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#설치-사용자"
          cat >> notes.md <<EOF

          ---

          $MARKER
          ### 설치 안내

          **지원 OS: Windows · Linux.** 설치 절차·전제조건·첫 실행은 [README 설치 절]($README) 참조.

          이 빌드는 **코드서명이 없다.** 그래서 OS 가 설치를 막는다:

          - **Windows**: SmartScreen 이 *"Windows에서 PC를 보호했습니다"* 를 띄운다 → **「추가 정보」 → 「실행」**
          - **Linux**: \`chmod +x Fleet-*.AppImage\` 후 실행

          출처 검증(인스톨러 자산 한정): \`gh attestation verify <파일> --repo $GITHUB_REPOSITORY\`

          ### ⚠ 알려진 제약 (0.1.x)

          - **워크스페이스는 npm 프로젝트여야 합니다.** 검증 단계가 \`npm run typecheck\`·\`lint\`·\`test\`
            로 고정돼 있어, Python·Go·Rust·빈 폴더에서는 모든 작업이 성공해도 프로젝트가 「검증 실패」로
            끝납니다. 게다가 자동 수정 라운드가 그 실패를 고치려다 **워크스페이스에 \`package.json\` 을
            만들어 넣을 수 있습니다.** JS/TS 저장소가 아니라면 이 버전은 권장하지 않습니다(추적: #300).
          - 프로젝트 실행에는 구독형 CLI(\`claude\`/\`codex\`/\`gemini\`) 최소 1개가 필요합니다 — API 키만으로는
            실행되지 않습니다.
          EOF
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  build:
    needs: prepare
    # build 잡은 attestation 용 id-token/attestations(write)가 추가로 필요한데, job-level permissions 를
    # 선언하면 미명시 스코프가 none 으로 떨어진다. electron-builder --publish always 는 GH_TOKEN
    # (=secrets.GITHUB_TOKEN = 잡 토큰)으로 Release 에 자산을 업로드하므로 contents:write 를 반드시 유지한다
    # (read 로 내리면 "Resource not accessible by integration" 으로 publish 실패 — Codex P1). checkout 도 write 가 충족.
    permissions:
      contents: write # electron-builder --publish always 자산 업로드 + checkout (GITHUB_TOKEN 스코프)
      id-token: write # sigstore OIDC 서명 토큰 (attest-build-provenance 필수)
      attestations: write # attestations API 기록 (필수)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # draft 가 이미 존재하므로 electron-builder 는 생성하지 않고 자산만 업로드.
      # prerelease 태그(v*-beta*/-alpha*)는 publish 채널을 명시한다 — GitHub provider 는 버전 태그에서
      # 채널을 추론하지 않으므로(electron-builder 문서), 명시 없이는 beta 클라이언트(autoUpdater.channel=beta)가
      # 읽을 beta.yml 이 잘못 발행된다(#98). stable 태그는 인자 없이 기존 경로 유지(무영향).
      - name: Publish (prerelease 는 채널 명시)
        shell: bash
        run: |
          CHANNEL_ARG=""
          case "$GITHUB_REF_NAME" in
            *-beta*) CHANNEL_ARG="-c.publish.channel=beta" ;;
            *-alpha*) CHANNEL_ARG="-c.publish.channel=alpha" ;;
            # `-rc` 와 그 외 **모든** 프리릴리스 식별자(`v1.2.3-<id>`)는 **beta 피드**로 보낸다.
            # 두 가지를 동시에 만족해야 한다(Codex 2R·3R P1):
            #  ① stable 피드(latest.yml)를 갱신하지 않을 것 — prepare 잡의 `--prerelease` 판정은 `*-*`
            #     인데 여기만 beta/alpha 열거라, 열거 밖 태그(`-rc`)가 채널 인자 없이 stable 을 갱신했다.
            #     ADR-0018 이 `v1.0.0-rc.1` 을 처방하므로 가정이 아니라 예정된 경로였다.
            #  ② **읽는 클라이언트가 존재할 것** — 앱의 채널은 `stable | beta` 둘뿐이고
            #     (`shared/types.ts` `UpdaterChannel`) `auto-update.ts` 의 `feedChannel` 은
            #     latest.yml / beta.yml 만 매핑한다. `rc.yml` 같은 새 채널은 아무도 읽지 않아
            #     격리가 아니라 **배달 불가**가 된다 — "프리릴리스 포함"을 opt-in 한 beta 사용자조차
            #     RC 를 못 받는다. 프리릴리스의 수신 대상이 곧 beta 코호트이므로 beta 로 보낸다.
            # (`-alpha` 는 기존 동작 유지 — 같은 무소비자 문제가 있으나 이 PR 범위 밖이다.)
            *-*) CHANNEL_ARG="-c.publish.channel=beta" ;;
          esac
          npx electron-builder --publish always $CHANNEL_ARG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 산출물 서명: electron-builder 가 dist/ 에 설치본을 만든 직후 build provenance attestation 생성.
      # 매트릭스 레그별로 자기 OS 산출물만 가리킨다(win=*.exe / linux=*.AppImage) — 0-match 면 액션 실패라
      # OS 조건부 subject-path 필수. *.exe 는 .exe.blockmap·latest.yml 을 매치하지 않아 레그당 정확히 1개.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ matrix.os == 'windows-latest' && 'dist/*.exe' || 'dist/*.AppImage' }}

  # 양 플랫폼 build 가 모두 성공해 draft 에 자산을 올린 뒤에만 공개(부분 릴리스 노출 방지).
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `needs: build` 는 **잡의 성공**만 보증한다. electron-builder 는 업로드를 건너뛰고도 exit 0 하므로
      # (위 prepare 주석 참조) 잡 성공이 자산 존재를 뜻하지 않는다 — v0.1.1 이 그 구멍으로 나갔다.
      # 공개는 immutable releases 아래에서 되돌릴 수 없으니, 공개 **전에** 자산을 직접 센다.
      # 채널별 파일명(latest/beta/alpha)을 열거하지 않고 부류로 판정한다 — 채널 라우팅이 바뀌어도
      # 이 게이트는 낡지 않는다(ADR-0016: 범프마다 낡는 열거는 게이트에 넣지 않는다).
      - name: 자산 실재 확인 (공개 전 fail-closed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > assets.txt
          echo "붙은 자산:"
          cat assets.txt
          MISSING=""
          grep -qE '\.exe$' assets.txt || MISSING="$MISSING Windows인스톨러(*.exe)"
          grep -qE '\.AppImage$' assets.txt || MISSING="$MISSING Linux인스톨러(*.AppImage)"
          grep -qE -- '-linux\.yml$' assets.txt || MISSING="$MISSING Linux업데이트메타(*-linux.yml)"
          grep -vE -- '-linux\.yml$' assets.txt | grep -qE '\.yml$' || MISSING="$MISSING Windows업데이트메타(*.yml)"
          if [ -n "$MISSING" ]; then
            echo "::error::릴리스 $GITHUB_REF_NAME 에 자산이 없다 —$MISSING"
            echo "::error::build 잡이 성공했더라도 electron-builder 가 업로드를 건너뛴 것이다. build 잡 로그에서 'reason=' 를 확인할 것."
            echo "::error::draft 를 공개하지 않고 중단한다 — 공개는 immutable 이라 되돌릴 수 없다."
            exit 1
          fi
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
