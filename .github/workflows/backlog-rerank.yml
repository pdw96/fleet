name: Backlog Rerank
on:
  workflow_dispatch:
    inputs:
      note:
        description: '재랭킹 트리거 사유(신규 입력 등)'
        required: false
permissions:
  contents: read
  issues: write
jobs:
  rerank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub App(OIDC) 대신 워크플로 GITHUB_TOKEN 사용 — id-token 권한·App 설치 불요
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            fleet-backlog-rerank 스킬의 절차를 따라 #27 백로그를 재랭킹하라.
            트리거 사유: ${{ github.event.inputs.note }}
            결과 표(후보·verdict·근거)를 이슈 #135 에 코멘트로 게시하라.
          claude_args: |
            --allowedTools "Read,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue list:*)"
