name: E2E

# Electron GUI e2e(playwright)는 빌드 + 실 디스플레이가 필요해 느리고 환경 의존이 크다(ci.yml 참조).
# CI 4게이트와 분리해 수동 dispatch + nightly cron 으로 돌린다(#98 — dispatch 안정화 후 cron 승격).
# schedule 은 기본 브랜치(master)의 워크플로만 실행된다. 시각은 정시 혼잡(스케줄 지연·드롭)을
# 피해 임의 분으로 오프셋 — 18:23 UTC = 03:23 KST(개발 활동 없는 새벽, 그날 머지분 회귀를 밤새 검증).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# 토큰 미사용(checkout·artifact 만) — 최소권한.
permissions:
  contents: read

jobs:
  e2e:
    name: playwright electron e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # 이 레포의 electron 패키지는 postinstall 바이너리 다운로드가 자동 실행되지 않는다
      # (npm ci 가 ~5s 에 끝나고 node_modules/electron/dist/ 가 비어 첫 dispatch 가 chrome-sandbox
      # 부재로 실패함을 실측). ci.yml 게이트는 electron-vite build(JS 번들)·vitest 라 바이너리가
      # 불필요했지만 e2e 는 실 Electron 을 띄우므로 명시 설치한다(install.js 는 isInstalled 가드로 idempotent).
      - name: Electron 바이너리 설치
        run: node node_modules/electron/install.js

      # Electron(=Chromium/GTK) 런타임 시스템 라이브러리 설치. 전체 설치로 ubuntu 24.04 의
      # t64 패키지명 전환(libasound2t64·libgtk-3-0t64 등)을 playwright 가 버전별로 알아서 해석한다.
      # (xvfb 는 ubuntu-latest 러너에 사전설치 — 별도 불요.)
      - name: Electron 런타임 deps
        run: npx playwright install-deps

      # web 프로젝트(#197 B4)는 chromium 브라우저 바이너리가 필요하다(electron e2e 는 자체 바이너리).
      - name: Install chromium (web e2e)
        run: npx playwright install chromium

      # Electron setuid 샌드박스 정상화. e2e 는 --no-sandbox 없이 띄우므로(프로덕션 충실)
      # 샌드박스를 끄지 않고: (1) 24.04 AppArmor 의 unprivileged userns 제약을 풀고
      # (2) chrome-sandbox 헬퍼를 root:root + 4755 로 맞춘다.
      - name: Electron 샌드박스 정상화
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # xvfb 가상 디스플레이 위에서 빌드 + e2e(test:e2e = electron-vite build && playwright test).
      - name: E2E (xvfb + playwright)
        run: xvfb-run -a --server-args="-screen 0 1280x960x24" npm run test:e2e

      # 실패/취소 무관하게 html 리포트 + trace 업로드(디버깅용; 정상이면 trace 없음).
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
