name: E2E

# Electron GUI e2e(playwright)는 빌드 + 실 디스플레이가 필요해 느리고 환경 의존이 크다(ci.yml 참조).
# CI 4게이트와 분리해 수동 dispatch 로만 돌린다. 1~2주 안정화 후 nightly cron(schedule) 추가 예정.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# 토큰 미사용(checkout·artifact 만) — 최소권한.
permissions:
  contents: read

jobs:
  e2e:
    name: playwright electron e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # Electron(=Chromium/GTK) 런타임 시스템 라이브러리 설치. 전체 설치로 ubuntu 24.04 의
      # t64 패키지명 전환(libasound2t64·libgtk-3-0t64 등)을 playwright 가 버전별로 알아서 해석한다.
      # (xvfb 는 ubuntu-latest 러너에 사전설치 — 별도 불요.)
      - name: Electron 런타임 deps
        run: npx playwright install-deps

      # Electron setuid 샌드박스 정상화. e2e 는 --no-sandbox 없이 띄우므로(프로덕션 충실)
      # 샌드박스를 끄지 않고: (1) 24.04 AppArmor 의 unprivileged userns 제약을 풀고
      # (2) chrome-sandbox 헬퍼를 root:root + 4755 로 맞춘다.
      - name: Electron 샌드박스 정상화
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # xvfb 가상 디스플레이 위에서 빌드 + e2e(test:e2e = electron-vite build && playwright test).
      - name: E2E (xvfb + playwright)
        run: xvfb-run -a --server-args="-screen 0 1280x960x24" npm run test:e2e

      # 실패/취소 무관하게 html 리포트 + trace 업로드(디버깅용; 정상이면 trace 없음).
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
